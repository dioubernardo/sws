worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;

    # Compressão
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;

    gzip_types
        text/plain
        text/css
        text/html
        application/javascript
        application/json
        application/xml
        application/wasm
        image/svg+xml;

    server {
        listen 3000;
        server_name _;

        root /usr/share/nginx/html;

        # Health check
        location = /_health {
            return 200;
        }

        # Diretórios devem procurar index.html
        location / {
            try_files $uri $uri/ =404;
        }
    }
}